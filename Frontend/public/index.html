<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactManager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <header class="topbar">
        <h1> ContactManager</h1>
        <div class="search-box">
            <input type="text" placeholder="Search contacts by naam en voornaam">
            <button>Search</button>
        </div>
        <button class="add-btn" id="contactaddbar-btn">Toevoegen Contact</button>
    </header>

    <main class="container">
        <aside class="sidebar">
            <ul>
                <li class="active">Contacts</li>
                <li>Download</li>
                <li>Upload </li>
            </ul>
        </aside>

        <section class="contact-list">
            <div class="section-header">
                <h2>Contacts</h2>
            </div>


            <div class="table-scroll-container">
                <table class="table" id="tablecontacten">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody id="tbodycontacten">
                    </tbody>
                </table>
            </div>

        </section>

        <section class="details hidden" id="contactadd-section">

            <form action="" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="addName">Naam:</label>
                    <input type="text" id="addName" name="addName" placeholder="Naam..." value="Voornaam Naam" />
                </div>

                <div class="form-group">
                    <label for="addPhone">Phone:</label>
                    <input type="text" id="addPhone" name="addPhone" placeholder="Phone..." value="+32473112233" />
                </div>

                <div class="form-group">
                    <label for="addEmail">Email:</label>
                    <input type="text" id="addEmail" name="addEmail" placeholder="Email..."
                           value="yourmail@gmail.com" />
                </div>
            </form>

            <div class="card-buttons">
                <button class="blue-button" id="addsave-btn">SAVE</button>
                <button class="red-button" id="addcancel-btn">CANCEL</button>
            </div>

        </section>

        <div class="popup-overlay" id="popupOverlay">

            <div class="popup">

                <form action="" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="upName">Naam:</label>
                        <input type="text" id="upName" name="upName" placeholder="Naam..." value="" />
                    </div>

                    <div class="form-group">
                        <label for="upPhone">Phone:</label>
                        <input type="text" id="upPhone" name="upPhone" placeholder="Phone..." value="" />
                    </div>

                    <div class="form-group">
                        <label for="upEmail">Email:</label>
                        <input type="text" id="upEmail" name="upEmail" placeholder="Email..." value="" />
                    </div>
                </form>

                <div class="card-buttons">
                    <button class="blue-button" id="upsave-btn">SAVE</button>
                    <button class="red-button" id="upcancel-btn">CANCEL</button>
                </div>
            </div>
        </div>
    </main>
    <script src="../src/contact.js"></script>
    <script src="../src/storagelist.js"></script>
    <script src="../src/render.js"></script>
    <script src="../src/main.js"></script>
    <script src="../src/add.js"></script>
    <script src="../src/delete.js"></script>
    <script src="../src/update.js"></script>
    <script src="../src/file.js"></script>
</body>

</html>
