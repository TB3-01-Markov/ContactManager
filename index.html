<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactManager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>
<body>

    <header class="topbar">
        <h1> ContactManager</h1>
        <div class="search-box">
            <input type="text" placeholder="Search contacts by naam">
            <button>Search</button>
        </div>
        <button class="add-btn" id="contactaddbar-btn">Toevoegen Contact</button>
    </header>

    <main class="container">
        <aside class="sidebar">
            <ul>
                <li class="active">Contacts</li>
                <li>Download</li>
                <li>Upload </li>
            </ul>
        </aside>

        <section class="contact-list">
            <div class="section-header">
                <h2>Contacts</h2>
            </div>


            <div class="table-scroll-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Mark Meyers</td>
                            <td>+32 473 31 32 66</td>
                            <td>markmeyers@gmail.com</td>
                            <td>
                                <button class="blue-button">UPDATE</button>
                                <button class="red-button">DELETE</button>
                            </td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>Lucas Gent</td>
                            <td>+32 473 13 24 41</td>
                            <td>lucasgent9000@gmail.com</td>
                            <td>
                                <button class="blue-button">UPDATE</button>
                                <button class="red-button">DELETE</button>
                            </td>
                        </tr>

                        <tr>
                            <td>3</td>
                            <td>Phillip Olimpiado</td>
                            <td>+32 473 21 24 39</td>
                            <td>philipvanbrugge1@gmail.com</td>
                            <td>
                                <button class="blue-button">UPDATE</button>
                                <button class="red-button">DELETE</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

        <section class="details hidden" id="contactadd-section">
            <h3 class="mb-4">Nieuwe Contact</h3>

            <form action="" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="addName">Naam:</label>
                    <input type="text" id="addName" name="addName" placeholder="Naam..." value="Tom Soyer" />
                </div>

                <div class="form-group">
                    <label for="addPhone">Phone:</label>
                    <input type="text" id="addPhone" name="addPhone" placeholder="Phone..." value="32 471 12 34 56" />
                </div>

                <div class="form-group">
                    <label for="addEmail">Email:</label>
                    <input type="text" id="addEmail" name="addEmail" placeholder="Email..." value="tomsoyer12@email.com" />
                </div>
            </form>

            <div class="card-buttons">
                <button class="blue-button">SAVE</button>
                <button class="red-button">CANCEL</button>
            </div>

        </section>
    </main>
    <script src="indexScript1.js"></script>
</body>
</html>
